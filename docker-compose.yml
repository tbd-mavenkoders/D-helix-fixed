version: '3.8'

services:
  d-helix-api:
    build: .
    image: d-helix:latest
    ports:
      - "10012-10023:10012"  # Map ports for up to 12 instances
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Optional: Mount local results directory to persist verification results
      - ./verification_results:/tmp/d_helix_work
    deploy:
      replicas: 1  # Change to 12 for parallel processing
      resources:
        limits:
          cpus: '2'       # Limit each instance to 2 CPUs
          memory: 16G     # Limit each instance to 16GB RAM
        reservations:
          cpus: '1'
          memory: 8G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx load balancer for multiple API instances
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - d-helix-api
    restart: unless-stopped
    deploy:
      replicas: 1

# For high-throughput deployment with 24 CPUs and 256GB RAM:
# docker-compose up --scale d-helix-api=12
#
# This will run 12 API instances, each using ~2 CPUs and ~12-16GB RAM
# Total resource usage: ~24 CPUs, ~144-192GB RAM
#
# Access via:
# - Direct: http://localhost:10012-10023 (individual instances)
# - Load balanced: http://localhost:80 (via nginx)
