events {
    worker_connections 4096;
}

http {
    upstream d-helix-api {
        # Automatically discovers all d-helix-api instances
        # For docker-compose scale, use DNS round-robin
        server d-helix-api:10012 max_fails=3 fail_timeout=30s;
        
        # For manual scaling, uncomment and add more servers:
        # server d-helix-api-1:10012;
        # server d-helix-api-2:10012;
        # ... etc
        
        # Load balancing method (default is round-robin)
        # least_conn;  # Route to server with least connections
        # ip_hash;     # Sticky sessions based on client IP
    }

    server {
        listen 80;
        
        # Increase timeouts for long-running verification tasks
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Increase max upload size for large binaries
        client_max_body_size 100M;
        
        location / {
            proxy_pass http://d-helix-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (if needed for real-time updates)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # Health check endpoint (bypass proxy for monitoring)
        location /health {
            proxy_pass http://d-helix-api/health;
            access_log off;
        }
    }
}
